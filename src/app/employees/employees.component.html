<a class="btn btn-primary" [routerLink]="['/employee']">Add Employee</a>
<div class="container">
  @if (error) { <p class="alert alert-danger">{{error}}</p> }
  <table class="table">
    <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Date of birth</th>
      <th scope="col">City</th>
      <th scope="col">Salary</th>
      <th scope="col">Gender</th>
      <th scope="col">Email</th><th scope="col">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let emp of employees.employees$ | async">
      <td>{{emp.name}}</td>
      <td>{{emp.dateOfBirth | date :'d/MMM/y'}}</td>
      <td>{{emp.city}}</td>
      <td>{{emp.salary}}</td>
      <td>{{emp.gender}}</td>
      <td>{{emp.email}}</td><td><button class="btn btn-sm btn-outline-danger" (click)="remove(emp)">Delete</button></td>
    </tr>
    </tbody>
  </table>
</div>
